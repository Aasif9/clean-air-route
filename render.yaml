services:
  - type: web
    name: kolkata-clean-air-route
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn multi_route_api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    region: oregon
    branch: main
    rootDir: .
